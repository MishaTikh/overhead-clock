; MSP Overhead firmware for the Ulanzi TC001 (ESP32-WROOM, 8x32 WS2812 matrix)
[env:tc001]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:tools/embed_ui.py
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
